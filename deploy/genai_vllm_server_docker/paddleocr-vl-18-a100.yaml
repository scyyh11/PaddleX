# Validated target: single NVIDIA A100 (SM80), vLLM 0.33.0, PaddleOCR-VL 1.8.
paddlex-vision-batching: true
paddlex-vision-rope: true
dtype: bfloat16
trust-remote-code: true
trust-request-mm-kwargs: true
gpu-memory-utilization: 0.36
max-model-len: 16384
max-num-batched-tokens: 32768
max-num-seqs: 512
kv-cache-memory-bytes: 8589934592
api-server-count: 2
prefill-schedule-interval: 8
attention-backend: FLASH_ATTN
no-enable-prefix-caching: true
mm-processor-cache-gb: 0
disable-log-requests: true
